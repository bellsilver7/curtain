[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curtain"
version = "0.1.0"
description = "좌석 지정 공연 티켓 예매 시스템 (토이 프로젝트)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "locust>=2.32",
    "psycopg[binary]>=3.2",
]

# app 만 임포트 가능한 패키지다. load/ 는 locust 스크립트, migrations/ 는
# alembic 이 직접 읽는 디렉터리, tests/ 는 pytest 가 rootdir 로 찾는다.
# 명시하지 않으면 setuptools 가 flat-layout 자동 탐색에서 셋 다 패키지로 보고 거부한다.
[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # 실제 Postgres/Redis가 떠 있어야 하는 테스트.  make test-unit 에서는 제외된다.
    "integration: requires docker-compose services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
# app/domain 은 순수 파이썬이므로 가장 엄격하게 본다 (§9 계층 규칙).
files = ["app"]
