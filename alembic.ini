# Alembic 설정 — 설계 문서 §3, docs/adr/0002-migrations.md
[alembic]
script_location = migrations
prepend_sys_path = .

# 리비전 파일명: 0001_설명.py 처럼 순번이 앞에 오게 한다.
# 해시만 있는 파일명은 목록을 봐도 순서를 알 수 없다.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url 은 여기 두지 않는다. migrations/env.py 가 DATABASE_URL 을 읽는다.
# ini 에 접속 문자열을 박으면 비밀번호가 저장소에 남는다.

[post_write_hooks]
hooks = ruff_format,ruff_fix
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = console_scripts
ruff_fix.entrypoint = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
